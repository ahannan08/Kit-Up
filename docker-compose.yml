version: "3.8"
services:
      mongodb:
        container_name : mongo
        image: mongo:latest
        ports:
          - "27017:27017"
        volumes:
          - mongo-data:/data/db


      backend:
        container_name: backend
        build: ./backend
        ports:
          - "3009:3009"
        depends_on:
          - mongodb    
        environment:
          - MONGO_URI=mongodb://mongo:27017/kit-db
          - PORT=3009
          - JWT_SECRET=docker-dev-secret


      frontend:
        container_name: frontend
        build: ./frontend/kit-app
        ports:
          - "3000:3000"
        depends_on:
          - backend    

volumes:
      mongo-data:
